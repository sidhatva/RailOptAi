# ─── RailOpt AI Backend — Application Configuration ─────────────────────────
server.port=8080
spring.application.name=railopt-backend

# ─── PostgreSQL Database Configuration ───────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/railopt}
spring.datasource.username=${DB_USERNAME:railopt}
spring.datasource.password=${DB_PASSWORD:railopt123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Naming: Java camelCase -> SQL snake_case
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# ─── Jackson ─────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.com.railopt=INFO
logging.level.org.hibernate.SQL=WARN
