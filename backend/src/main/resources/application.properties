# ─── RailOpt AI Backend — Application Configuration ─────────────────────────

# Server
server.port=8080
spring.application.name=railopt-backend

# ─── PostgreSQL DataSource ────────────────────────────────────────────────────
# All sensitive values are read from environment variables.
# Set DB_URL, DB_USERNAME, DB_PASSWORD before starting the application.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/railopt}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP defaults are production-safe)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
# 'update' creates/alters tables automatically — switch to 'validate' in production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Naming: Java camelCase → SQL snake_case
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# ─── Jackson ─────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.com.railopt=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
